<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Ration & Expense Manager</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #eef2f5;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 15px; }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #34495e;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button.add-btn {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button.add-btn:hover { background-color: #219653; }
        .budget-box, .filter-box {
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 15px;
        }
        .table-wrap { width: 100%; overflow-x: auto; }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        th { background-color: #f8f9fa; color: #2c3e50; }
        .delete-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .action-btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .download-btn, .clear-all-btn {
            flex: 1;
            padding: 10px;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .download-btn { background-color: #2980b9; }
        .download-btn:hover { background-color: #2471a3; }
        .clear-all-btn { background-color: #c0392b; }
        .clear-all-btn:hover { background-color: #962d22; }
        .total-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #2c3e50;
            color: white;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .alert-box {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            display: none;
        }
        @media (max-width: 420px) {
            body { padding: 8px; }
            .container { padding: 14px; }
            th, td { padding: 8px 6px; font-size: 12px; }
            .action-btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>
    <main class="container">
        <h2>Smart Ration &amp; Expense Manager</h2>

        <div class="budget-box">
            <label for="monthlyBudget">Set Monthly Budget (₹):</label>
            <input type="number" id="monthlyBudget" min="0" step="0.01" placeholder="e.g., 5000">
        </div>

        <div class="form-group">
            <label for="itemName">Item Name:</label>
            <input type="text" id="itemName" placeholder="e.g., Rice, Dal, Bill">
        </div>

        <div class="form-group">
            <label for="category">Category:</label>
            <select id="category">
                <option value="Ration / Grocery">Ration / Grocery</option>
                <option value="Household Expense">Household Expense</option>
                <option value="Electricity / Water Bill">Electricity / Water Bill</option>
                <option value="Others">Others</option>
            </select>
        </div>

        <div class="form-group">
            <label for="itemAmount">Amount (₹):</label>
            <input type="number" id="itemAmount" min="0" step="0.01" placeholder="e.g., 500">
        </div>

        <button class="add-btn" id="addBtn">Add Expense</button>

        <div class="filter-box" style="margin-top: 20px;">
            <label for="filterCategory">Filter by Category:</label>
            <select id="filterCategory">
                <option value="All">All Categories</option>
                <option value="Ration / Grocery">Ration / Grocery</option>
                <option value="Household Expense">Household Expense</option>
                <option value="Electricity / Water Bill">Electricity / Water Bill</option>
                <option value="Others">Others</option>
            </select>
        </div>

        <h3>Inventory &amp; Expenses List</h3>
        <div class="table-wrap">
            <table id="itemTable">
                <thead>
                    <tr><th>Item</th><th>Category</th><th>Amount</th><th>Action</th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="total-box" id="totalBox">
            Total Spent: ₹<span id="totalAmount">0.00</span>
        </div>
        <div id="budgetAlert" class="alert-box" role="status" aria-live="polite"></div>

        <div class="action-btn-group">
            <button class="download-btn" id="downloadBtn">Download CSV</button>
            <button class="clear-all-btn" id="clearAllBtn">Clear All</button>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
